<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Pixel Art Studio</h1>
  </header>

  <div class="layout">
    <aside class="toolbar">
      <div class="toolbar__section">
        <h3 class="toolbar__label">Инструменты</h3>
        <button class="tool-btn tool-btn--active" data-tool="brush">Кисть</button>
        <button class="tool-btn" data-tool="eraser">Ластик</button>
        <button class="tool-btn" data-tool="fill">Заливка</button>
        <button class="tool-btn" data-tool="picker">Пипетка</button>
      </div>

      <div class="toolbar__section">
        <h3 class="toolbar__label">Размер кисти</h3>
        <input type="range" class="brush-size" min="1" max="5" value="1">
        <span class="brush-size-value">1</span>
      </div>

      <div class="toolbar__section">
        <h3 class="toolbar__label">Цвет</h3>
        <div class="color-picker-wrapper" id="colorPickerWrapper">
          <div class="color-preview" id="colorPreview">
            <span class="color-preview-text" id="colorHex">#000000</span>
          </div>
          <div class="color-picker-popup" id="colorPickerPopup">
            <span class="custom-color-label">Свой цвет</span>
            <input type="color" class="custom-color-input" id="customColor" value="#000000">
            <span class="custom-color-label">Базовые</span>
            <div class="base-colors">
              <button class="base-color" data-color="#000000" style="background:#000000"></button>
              <button class="base-color" data-color="#333333" style="background:#333333"></button>
              <button class="base-color" data-color="#666666" style="background:#666666"></button>
              <button class="base-color" data-color="#999999" style="background:#999999"></button>
              <button class="base-color" data-color="#cccccc" style="background:#cccccc"></button>
              <button class="base-color" data-color="#ffffff" style="background:#ffffff"></button>
              <button class="base-color" data-color="#ff6b6b" style="background:#ff6b6b"></button>
              <button class="base-color" data-color="#ffa94d" style="background:#ffa94d"></button>
              <button class="base-color" data-color="#ffd43b" style="background:#ffd43b"></button>
              <button class="base-color" data-color="#69db7c" style="background:#69db7c"></button>
              <button class="base-color" data-color="#4dabf7" style="background:#4dabf7"></button>
              <button class="base-color" data-color="#da77f2" style="background:#da77f2"></button>
            </div>
            <div class="recent-colors">
              <span class="recent-label">Недавние</span>
              <div class="recent-colors-row" id="recentColorsRow"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar__section">
        <h3 class="toolbar__label">Отмена</h3>
        <div class="undo-redo-row">
          <button class="action-btn action-btn--undo" id="undoBtn">Отменить</button>
          <button class="action-btn action-btn--redo" id="redoBtn">Вернуть</button>
        </div>
      </div>

      <div class="toolbar__section">
        <h3 class="toolbar__label">Разрешение</h3>
        <select class="resolution-select" id="resolutionSelect">
          <option value="8">8 x 8</option>
          <option value="16">16 x 16</option>
          <option value="24">24 x 24</option>
          <option value="32" selected>32 x 32</option>
          <option value="48">48 x 48</option>
          <option value="64">64 x 64</option>
          <option value="96">96 x 96</option>
          <option value="128">128 x 128</option>
        </select>
      </div>

      <div class="toolbar__section">
        <h3 class="toolbar__label">Изображение</h3>
        <button class="action-btn action-btn--reference" id="referenceBtn">Загрузить</button>
        <button class="action-btn action-btn--reference" id="referenceToggle" style="display:none">Скрыть</button>
        <div class="reference-controls" id="referenceControls" style="display:none">
          <div class="reference-control">
            <label class="reference-label">Прозрачность</label>
            <input type="range" class="reference-opacity" min="0" max="100" value="50">
            <input type="number" class="reference-number" id="opacityNumber" min="0" max="100" value="50">
          </div>
          <div class="reference-control">
            <label class="reference-label">Размер</label>
            <input type="range" class="reference-scale" min="10" max="300" value="100">
            <input type="number" class="reference-number" id="scaleNumber" min="10" max="300" value="100">
          </div>
          <div class="reference-control">
            <label class="reference-label">Поворот</label>
            <input type="range" class="reference-rotate" min="-180" max="180" value="0">
            <input type="number" class="reference-number" id="rotateNumber" min="-180" max="180" value="0">
          </div>
          <div class="reference-control">
            <label class="reference-label">Поверх холста</label>
            <button class="action-btn action-btn--reference" id="referenceFrontBtn">Включить</button>
          </div>
        </div>
      </div>

      <div class="toolbar__section toolbar__section--bottom">
        <button class="action-btn action-btn--clear" id="clearBtn">Очистить</button>
        <button class="action-btn action-btn--download" id="downloadBtn">Скачать</button>
      </div>
    </aside>

    <main class="canvas-area">
      <div class="reference-container" id="referenceContainer">
        <div class="reference-wrapper" id="referenceWrapper">
          <img class="reference-image" id="referenceImage" src="" alt="Референс">
          <div class="reference-handle reference-handle--rotate" id="handleRotate"></div>
          <div class="reference-handle reference-handle--nw" id="handleNW"></div>
          <div class="reference-handle reference-handle--ne" id="handleNE"></div>
          <div class="reference-handle reference-handle--sw" id="handleSW"></div>
          <div class="reference-handle reference-handle--se" id="handleSE"></div>
          <div class="reference-handle reference-handle--n" id="handleN"></div>
          <div class="reference-handle reference-handle--s" id="handleS"></div>
          <div class="reference-handle reference-handle--e" id="handleE"></div>
          <div class="reference-handle reference-handle--w" id="handleW"></div>
        </div>
      </div>
      <canvas id="drawingCanvas"></canvas>
      <input type="file" id="referenceFileInput" accept="image/*" style="display:none">
    </main>
  </div>

  <!-- Download Modal -->
  <div class="modal-overlay" id="downloadModal">
    <div class="modal">
      <h3 class="modal__title">Скачать рисунок</h3>
      <div class="modal__content">
        <p class="modal__info">Сохранить рисунок (<span id="downloadResText">32×32</span>) в формате PNG?</p>
      </div>
      <div class="modal__footer">
        <button class="action-btn action-btn--cancel" id="downloadCancel">Отмена</button>
        <button class="action-btn action-btn--download" id="downloadConfirm">Скачать</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
